name: Checkin

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC；16:05 UTC = 次日 00:05（北京时间）
    - cron: '5 16 * * *'

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: Run daily check-in
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config.yaml 只保存在本地；运行时从示例文件生成
      - name: Prepare config
        run: cp config/config.yaml.example config/config.yaml

      - name: Prepare Feishu push config
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python prepare_push_config.py

      - name: Verify required secrets
        env:
          CHECK_COOKIE: ${{ secrets.COOKIE }}
          CHECK_STOKEN: ${{ secrets.STOKEN }}
        run: |
          if [ -z "$CHECK_COOKIE" ] || [ -z "$CHECK_STOKEN" ]; then
            echo "::error::缺少 COOKIE 或 STOKEN。请到 Settings > Secrets and variables > Actions 添加仓库 Secret。"
            exit 1
          fi

      - name: Execute check-in
        env:
          cookie: ${{ secrets.COOKIE }}
          stoken: ${{ secrets.STOKEN }}
          CAPTCHA_ENDPOINT: ${{ secrets.CAPTCHA_ENDPOINT }}
          TZ: Asia/Shanghai
        run: python main.py

      # 脚本异常退出时兜底提醒；正常的签到失败由 push.py 自行推送
      - name: Notify Feishu on workflow failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_feishu_failure.py
